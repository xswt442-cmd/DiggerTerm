name: 'Set up Windows build and test environment'
description: 'Checks out the repository and installs the Go and Node toolchains.'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
