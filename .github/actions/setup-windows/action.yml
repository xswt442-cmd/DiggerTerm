name: 'Set up Windows build and test environment'
description: 'Installs the Go and Node toolchains. Run after actions/checkout.'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
