name: Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      # main.go embeds frontend/dist; the Vite build must precede go test/vet.
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Go tests and vet
        run: |
          go test ./...
          go vet ./...
      - name: Install pinned Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
          "$(go env GOPATH)\bin" >> $env:GITHUB_PATH
      - name: Build Windows application
        run: wails3 build
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'bin/diggerterm.exe')) { throw 'Expected Windows executable was not built' }
