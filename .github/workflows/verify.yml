name: verify

# Single owner of the verification chain; called by the ci and publish workflows.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: linux x64 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-linux
      - name: Check bilingual release generation
        run: node --test scripts/release-notes.test.mjs scripts/release-downloads.test.mjs
      - name: Check documentation and PR collaboration files
        run: |
          node --test scripts/check-docs.test.mjs
          node scripts/check-docs.mjs
          node .github/engineering/scripts/sync-pr.mjs --check .
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run all frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Go tests and vet
        run: |
          go test ./... -count=1
          go vet ./...

  windows:
    name: windows x64 tests and build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-windows
      - name: Check bilingual release generation
        run: node --test scripts/release-notes.test.mjs scripts/release-downloads.test.mjs
      - name: Check documentation and PR collaboration files
        run: |
          node --test scripts/check-docs.test.mjs
          node scripts/check-docs.mjs
          node .github/engineering/scripts/sync-pr.mjs --check .
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test frontend preferences, themes, shortcuts and layouts
        run: npm --prefix frontend test
      # main.go embeds frontend/dist; the Vite build must precede go test/vet.
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Go tests and vet
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags server ./internal/desktop -run '^TestUnsupportedNativeClipboardReportsFailure$' -count=1
      - name: Install pinned Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
          "$(go env GOPATH)\bin" >> $env:GITHUB_PATH
      - name: Build Windows application
        run: wails3 build
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'bin/diggerterm.exe')) { throw 'Expected Windows executable was not built' }
